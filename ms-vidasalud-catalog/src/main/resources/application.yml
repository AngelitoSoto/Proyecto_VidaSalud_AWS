server:
  port: 8083

spring:
  application:
    name: ms-vidasalud-catalog
  datasource:
    url: jdbc:h2:mem:vidasalud_catalog_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    cl.duoc.vidasalud: DEBUG
