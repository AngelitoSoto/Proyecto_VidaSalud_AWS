server:
  port: 8084

spring:
  application:
    name: ms-vidasalud-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

app:
  rabbitmq:
    exchanges:
      topic: cmd.topic
      direct: cmd.direct
      dlx: cmd.dead.dlx
    queues:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      admission: q.cmd.admission
      admission-dlq: q.cmd.admission.dlq
      record: q.cmd.record
      record-dlq: q.cmd.record.dlq
    routing-keys:
      email-dlq: email.dlq
      admission-dlq: admission.dlq
      record-dlq: record.dlq