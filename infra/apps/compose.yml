version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-appointments:
    build:
      context: ../../ms-vidasalud-appointments
      dockerfile: Dockerfile
    container_name: ms-vidasalud-appointments
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - rabbitmq
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-catalog:
    build:
      context: ../../ms-vidasalud-catalog
      dockerfile: Dockerfile
    container_name: ms-vidasalud-catalog
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-notify:
    build:
      context: ../../ms-vidasalud-notify
      dockerfile: Dockerfile
    container_name: ms-vidasalud-notify
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - rabbitmq
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-admin:
    build:
      context: ../../ms-vidasalud-admin
      dockerfile: Dockerfile
    container_name: ms-vidasalud-admin
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - rabbitmq
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-bff:
    build:
      context: ../../ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: ms-vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - APPOINTMENTS_SERVICE_URL=http://ms-vidasalud-appointments:8081
      - CATALOG_SERVICE_URL=http://ms-vidasalud-catalog:8083
      - ADMIN_SERVICE_URL=http://ms-vidasalud-admin:8085
    depends_on:
      - ms-vidasalud-appointments
      - ms-vidasalud-catalog
      - ms-vidasalud-admin
    networks:
      - vidasalud-network
    restart: unless-stopped

  frontend-vidasalud:
    build:
      context: ../../frontend-vidasalud
      dockerfile: Dockerfile
    container_name: frontend-vidasalud
    ports:
      - "4200:80"
    depends_on:
      - ms-vidasalud-bff
    networks:
      - vidasalud-network
    restart: unless-stopped

networks:
  vidasalud-network:
    driver: bridge